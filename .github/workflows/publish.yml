name: Publish

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish'
        required: true
        type: string
  push:
    tags:
      - '*'

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    name: Publish library
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: setup-java
        uses: actions/setup-java@v6
        with:
          java-version: 25
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Restore Gradle properties and signing key
        shell: bash
        env:
          GRADLE_PROPERTIES_CONTENT: ${{ secrets.GRADLE_PROPERTIES_CONTENT }}
          GPG_SECRET_KEY_RING_BASE64: ${{ secrets.GPG_SECRET_KEY_RING_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$GRADLE_PROPERTIES_CONTENT"
          test -n "$GPG_SECRET_KEY_RING_BASE64"
          gradle_dir="$HOME/.gradle"
          properties_file="$gradle_dir/gradle.properties"
          keyring="$gradle_dir/kmpalette-secret-key.gpg"
          mkdir -p "$gradle_dir"
          printf '%s' "$GRADLE_PROPERTIES_CONTENT" > "$properties_file"
          printf '%s' "$GPG_SECRET_KEY_RING_BASE64" | tr -d '\r\n ' | openssl base64 -d -A > "$keyring"
          test -s "$keyring"
          awk '!/^signing.secretKeyRingFile=/' "$properties_file" > "$properties_file.tmp"
          mv "$properties_file.tmp" "$properties_file"
          printf '\nsigning.secretKeyRingFile=%s\n' "$keyring" >> "$properties_file"
          chmod 600 "$properties_file" "$keyring"

      - name: Deploy to Sonatype
        shell: bash
        env:
          MANUAL_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            release_version="$MANUAL_VERSION"
          else
            release_version="$GITHUB_REF_NAME"
          fi

          if [[ ! "$release_version" =~ ^[0-9A-Za-z][0-9A-Za-z._-]*$ ]]; then
            echo "Invalid Maven version: $release_version" >&2
            exit 1
          fi

          echo "Publishing version: $release_version"
          export ORG_GRADLE_PROJECT_VERSION_NAME="$release_version"
          ./gradlew publishAllPublicationsToMavenCentral --no-configuration-cache --stacktrace
